name: CI
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:
    inputs:
      compatibility:
        description: Build every supported Minecraft target
        type: boolean
        default: false
  workflow_call:
    inputs:
      compatibility:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.compatibility || false }}
  cancel-in-progress: true
jobs:
  validate:
    name: Repository and license validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/verify-project.py
      - run: python scripts/verify-licenses.py
      - run: python scripts/audit-branding.py --report build/reports/branding.json
      - run: python -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: validation-diagnostics
          path: build/reports/
  client:
    name: Fabric client and bootstrap
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check build repository availability
        run: python scripts/check-build-repositories.py
      - name: Build and check selected clients
        env:
          COMPATIBILITY: ${{ inputs.compatibility || false }}
        run: |
          if [[ "$COMPATIBILITY" == true ]]; then
            bash gradlew clean build check --console=plain "-Porg.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
            python scripts/package-release.py stage-client
          else
            bash gradlew :1.21.11:clean :1.21.11:build :1.21.11:check :daisy-bootstrap:build :daisy-bootstrap:check --console=plain "-Porg.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
            python scripts/package-release.py stage-client --minecraft 1.21.11
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: fabric-clients
          path: launcher/src/bundled/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: client-diagnostics
          path: |
            build/reports/
            versions/*/build/reports/
  launcher:
    name: Launcher tests and native startup (${{ matrix.os }})
    needs: client
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: fabric-clients
          path: launcher/src/bundled
      - run: npm ci
        working-directory: launcher
      - run: npm audit --audit-level=high
        working-directory: launcher
      - run: npm test
        working-directory: launcher
      - run: npm run build:app
        working-directory: launcher
      - run: npm run test:startup
        if: runner.os == 'Windows'
        working-directory: launcher
      - run: xvfb-run -a npm run test:startup
        if: runner.os == 'Linux'
        working-directory: launcher
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: launcher-diagnostics-${{ runner.os }}
          path: |
            build/reports/
            launcher/*.log
