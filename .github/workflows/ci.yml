name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/verify-project.py
      - run: python scripts/audit-branding.py --report build/reports/branding.json
      - run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: bash gradlew clean build check --console=plain "-Porg.gradle.java.installations.paths=$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
      - run: python scripts/package-release.py stage-client
      - uses: actions/upload-artifact@v7
        with:
          name: fabric-clients
          path: launcher/src/bundled/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-reports
          path: build/reports/
  launcher:
    needs: client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: fabric-clients
          path: launcher/src/bundled
      - run: npm ci
        working-directory: launcher
      - run: npm test
        working-directory: launcher
      - run: npm run dist:dir
        working-directory: launcher
      - uses: actions/upload-artifact@v7
        with:
          name: electron-unpacked-windows
          path: launcher/dist/win-unpacked
          if-no-files-found: error
