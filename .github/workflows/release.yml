name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: daisy-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - id: version
        name: Validate coordinated release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python scripts/package-release.py version --tag "$GITHUB_REF_NAME")
          else
            version=$(python scripts/package-release.py version)
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            core.setOutput('publish', 'false');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
              if (data.draft) core.setFailed('A draft already exists for this version. Review it before retrying; existing assets will not be overwritten.');
              else core.setFailed('This version is already released. Existing releases will not be overwritten.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      compatibility: true
  package:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: fabric-clients
          path: launcher/src/bundled
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package-release.py version --tag "$env:RELEASE_TAG"
        if: runner.os == 'Windows'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package-release.py version --tag "$RELEASE_TAG"
        if: runner.os == 'Linux' 
      - run: npm ci
        working-directory: launcher
      - run: npm test
        working-directory: launcher
      - if: runner.os == 'Windows'
        run: npm run dist
        working-directory: launcher
      - if: runner.os == 'Linux'
        run: npm run dist:linux
        working-directory: launcher
      - name: Verify packaged Windows startup offline
        if: runner.os == 'Windows'
        run: node scripts/smoke-launcher.js --packaged
        working-directory: launcher
      - name: Verify packaged Linux startup offline
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-launcher.js --packaged
        working-directory: launcher
      - name: Verify silent Windows installation and installed startup
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-installer.js
        working-directory: launcher
      - uses: actions/upload-artifact@v7
        with:
          name: electron-release-${{ runner.os }}
          path: |
            launcher/dist/Daisy-Setup.exe
            launcher/dist/Daisy-Portable.exe
            launcher/dist/Daisy-Linux.tar.gz
          if-no-files-found: error
  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v8
        with:
          name: fabric-clients
          path: client-artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: electron-release-*
          path: release-artifacts
          merge-multiple: true
      - name: Restore per-target Gradle artifact layout
        shell: python
        run: |
          import runpy, shutil
          from pathlib import Path
          module = runpy.run_path('scripts/package-release.py')
          for mc in module['versions']():
              source = list(Path('client-artifacts').glob(f'daisy-client-*+{mc}.jar'))
              if len(source) != 1:
                  raise ValueError(f'Expected one Fabric client for {mc}')
              dest = Path(f'versions/{mc}/build/libs')
              dest.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source[0], dest / source[0].name)
      - name: Collect checksummed releases
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package-release.py collect --tag "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cp CHANGELOG.md release-notes.txt
          gh release create "$RELEASE_TAG" release-artifacts/* --target "$GITHUB_SHA" --draft --title "Daisy Client ${RELEASE_TAG#v}" --notes-file release-notes.txt
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
      - name: Verify published assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/verify-release.py --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify automatic client downloads from the published release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node launcher/scripts/verify-client-update.js "$RELEASE_TAG" 1.21.11
          node launcher/scripts/verify-client-update.js "$RELEASE_TAG" 26.2
          node launcher/scripts/verify-client-update.js "$RELEASE_TAG" 1.21.11 skin
          node launcher/scripts/verify-client-update.js "$RELEASE_TAG" 26.2 skin
      - name: Verify installed stable launcher upgrade through GitHub Latest
        if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --no-tags --depth=1 origin 34075f782555e2bced6d7165e282ce2a2b05fd75
          node launcher/scripts/verify-launcher-update.js "$RELEASE_TAG"
