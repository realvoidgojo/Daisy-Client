name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: daisy-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: version
        name: Validate coordinated release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python scripts/package-release.py version --tag "$GITHUB_REF_NAME")
          else
            version=$(python scripts/package-release.py version)
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DISTRIBUTION_AUTHORIZED: ${{ vars.DAISY_DISTRIBUTION_AUTHORIZED }}
        with:
          script: |
            core.setOutput('publish', 'false');
            if (process.env.DISTRIBUTION_AUTHORIZED !== 'true') {
              await core.summary.addRaw('Build validation runs, but release publication is blocked: document rights-holder authorization before setting DAISY_DISTRIBUTION_AUTHORIZED=true.').write();
              return;
            }
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
              if (data.draft) core.setFailed('A draft already exists for this version. Review it before retrying; existing assets will not be overwritten.');
              else await core.summary.addRaw('This version is already released. Bump the coordinated Daisy version for the next automatic release.').write();
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: fabric-clients
          path: launcher/src/bundled
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package-release.py version --tag "$env:RELEASE_TAG"
        if: runner.os == 'Windows'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package-release.py version --tag "$RELEASE_TAG"
        if: runner.os == 'Linux' 
      - run: npm ci
        working-directory: launcher
      - run: npm test
        working-directory: launcher
      - if: runner.os == 'Windows'
        run: npm run dist
        working-directory: launcher
      - if: runner.os == 'Linux'
        run: npm run dist:linux
        working-directory: launcher
      - uses: actions/upload-artifact@v4
        with:
          name: electron-release-${{ runner.os }}
          path: |
            launcher/dist/Daisy-Setup.exe
            launcher/dist/Daisy-Portable.exe
            launcher/dist/Daisy-Linux.tar.gz
          if-no-files-found: error
  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: fabric-clients
          path: client-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-release-*
          path: release-artifacts
          merge-multiple: true
      - name: Restore per-target Gradle artifact layout
        shell: python
        run: |
          import runpy, shutil
          from pathlib import Path
          module = runpy.run_path('scripts/package-release.py')
          for mc in module['versions']():
              source = list(Path('client-artifacts').glob(f'daisy-client-*+{mc}.jar'))
              if len(source) != 1:
                  raise ValueError(f'Expected one Fabric client for {mc}')
              dest = Path(f'versions/{mc}/build/libs')
              dest.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source[0], dest / source[0].name)
      - name: Collect checksummed releases
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/package-release.py collect --tag "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo 'Versioned Fabric client JARs and Electron launcher distributions. See README and LICENSE for requirements and terms.' > release-notes.txt
          gh release create "$RELEASE_TAG" release-artifacts/* --target "$GITHUB_SHA" --draft --title "Daisy Client ${RELEASE_TAG#v}" --notes-file release-notes.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
